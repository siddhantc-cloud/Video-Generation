<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ink: #020816;
        --navy: #071a3d;
        --cobalt: #2e7cf6;
        --electric: #68a8ff;
        --amber: #e9b96e;
        --warm-white: #f4f7fb;
        --muted: #aebbd0;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ink);
      }

      body {
        font-family: "Montserrat", sans-serif;
        color: var(--warm-white);
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        isolation: isolate;
        background: var(--ink);
      }

      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: var(--ink);
      }

      #background {
        position: absolute;
        inset: -26px;
        background-image: url("./assets/bridge-base.png");
        background-size: cover;
        background-position: center;
        transform-origin: 52% 42%;
        will-change: transform;
      }

      #grade {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 46%, rgba(46, 124, 246, 0.12) 0, rgba(46, 124, 246, 0) 43%),
          radial-gradient(circle at 76% 36%, rgba(233, 185, 110, 0.14) 0, rgba(233, 185, 110, 0) 30%),
          rgba(2, 8, 22, 0.48);
      }

      #top-shadow {
        position: absolute;
        inset: 0 0 auto;
        height: 760px;
        background: rgba(2, 8, 22, 0.56);
        box-shadow: 0 150px 190px rgba(2, 8, 22, 0.46);
      }

      #edge-vignette {
        position: absolute;
        inset: 0;
        box-shadow:
          inset 0 0 190px rgba(0, 0, 0, 0.54),
          inset 0 -240px 220px rgba(1, 5, 15, 0.58);
      }

      #grain {
        position: absolute;
        inset: 0;
        opacity: 0.18;
        mix-blend-mode: soft-light;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' seed='8' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.34'/%3E%3C/svg%3E");
      }

      #header {
        position: absolute;
        top: 104px;
        left: 74px;
        right: 74px;
        height: 58px;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      #header-rule {
        width: 58px;
        height: 5px;
        background: var(--amber);
        transform-origin: left center;
        box-shadow: 0 0 22px rgba(233, 185, 110, 0.38);
      }

      #eyebrow {
        font-family: "Space Mono", monospace;
        font-size: 25px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--muted);
      }

      #beat-index {
        margin-left: auto;
        font-family: "Space Mono", monospace;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--amber);
        font-variant-numeric: tabular-nums;
      }

      .headline {
        position: absolute;
        top: 228px;
        left: 74px;
        width: 920px;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.052em;
        font-weight: 900;
        text-transform: uppercase;
        text-wrap: balance;
        will-change: transform, opacity;
      }

      .headline span {
        display: block;
      }

      .headline .quiet {
        color: var(--muted);
        font-weight: 400;
      }

      .headline .accent {
        color: var(--amber);
      }

      #headline-1 {
        font-size: 86px;
      }

      #headline-2 {
        font-size: 99px;
      }

      #headline-3 {
        font-size: 91px;

      #data-field {

        top: 630px;
        left: 0;
        width: 1080px;
        height: 920px;
      }

      #market-svg,
      #sip-svg {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 920px;
        overflow: visible;
      }

      #market-ghost {
        fill: none;
        stroke: rgba(174, 187, 208, 0.22);
        stroke-width: 15;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #market-glow {
        fill: none;
        stroke: rgba(46, 124, 246, 0.34);
        stroke-width: 28;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: blur(11px);
      }

      #market-path {
        fill: none;
        stroke: var(--electric);
        stroke-width: 9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      #market-baseline {
        stroke: rgba(174, 187, 208, 0.25);
        stroke-width: 2;
        stroke-dasharray: 5 15;

      #market-label {

        left: 76px;

        align-items: center;

        height: 11px;
        border-radius: 50%;
        background: var(--electric);
        box-shadow: 0 0 20px rgba(104, 168, 255, 0.75);

      #reticle {
        position: absolute;
        left: 51px;
        top: 320px;
        width: 70px;
        height: 70px;
        border: 3px solid var(--amber);
        border-radius: 50%;
        box-shadow:
          0 0 0 10px rgba(233, 185, 110, 0.1),
          0 0 30px rgba(233, 185, 110, 0.38);
        will-change: transform, opacity;

      #reticle::before,
      #reticle::after {
        content: "";
        position: absolute;
        background: var(--amber);
      }

      #reticle::before {
        top: 31px;
        left: -15px;
        width: 94px;
        height: 3px;
      }

      #reticle::after {
        top: -15px;
        left: 31px;
        width: 3px;
        height: 94px;
      }

      #search-label {
        position: absolute;
        left: 94px;
        top: 453px;
        font-family: "Space Mono", monospace;
        color: var(--amber);
        font-size: 23px;
        font-weight: 700;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }

      #sip-rail-glow {
        stroke: rgba(233, 185, 110, 0.28);
        stroke-width: 28;
        stroke-linecap: round;
        filter: blur(9px);
      }

      #sip-rail {
        stroke: var(--amber);
        stroke-width: 7;
        stroke-linecap: round;
      }

      #sip-rail-base {
        stroke: rgba(244, 247, 251, 0.19);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-dasharray: 4 14;
      }

      .deposit {
        position: absolute;
        width: 58px;
        height: 58px;

        border: 4px solid var(--amber);

      .deposit::after {
        content: "";
        position: absolute;
        inset: 16px;
        border-radius: 50%;
        background: var(--warm-white);
        box-shadow: 0 0 18px rgba(244, 247, 251, 0.72);
      }

      #deposit-1 { left: 220px; top: 750px; }
      #deposit-2 { left: 310px; top: 660px; }
      #deposit-3 { left: 400px; top: 570px; }
      #deposit-4 { left: 490px; top: 480px; }
      #deposit-5 { left: 580px; top: 390px; }
      #deposit-6 { left: 670px; top: 300px; }
      #deposit-7 { left: 760px; top: 210px; }

      #cadence-label {
        position: absolute;
        left: 74px;
        top: 810px;
        font-family: "Space Mono", monospace;
        color: var(--warm-white);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.11em;

      #equal-amount {

        padding-left: 22px;

        color: var(--muted);
        font-size: 22px;
        line-height: 1.5;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      #equal-amount strong {
        display: block;
        color: var(--warm-white);
        font-size: 28px;
      }

      #principle {
        position: absolute;
        left: 74px;
        top: 1484px;
        height: 80px;
        display: flex;
        align-items: center;
        gap: 22px;
        font-family: "Space Mono", monospace;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.11em;
        color: var(--warm-white);
      }

      #principle-mark {
        position: relative;
        width: 48px;
        height: 48px;
      }

      #principle-mark::before,
      #principle-mark::after {
        content: "";
        position: absolute;
        left: 0;
        width: 48px;
        height: 6px;
        background: var(--amber);
        box-shadow: 0 0 18px rgba(233, 185, 110, 0.35);
      }

      #principle-mark::before {
        top: 13px;
      }

      #principle-mark::after {
        top: 29px;
      }

      #principle .muted {
        color: var(--muted);
      }

      #lower-rule {
        position: absolute;
        left: 74px;
        top: 1558px;
        width: 932px;
        height: 2px;
        background: rgba(174, 187, 208, 0.22);
        transform-origin: left center;
      }

    </style>

      const tl = gsap.timeline({

      const railLength = document.querySelector("#sip-rail").getTotalLength();
      const phase2Start = 133 / 30;

      gsap.set("#background", { scale: 1.025, x: -4, y: 0 });
      gsap.set("#header-rule", { scaleX: 0 });
      gsap.set(["#eyebrow", "#beat-index"], { opacity: 0, y: 15 });

      tl.to("#headline-1", { opacity: 1, y: 0, duration: 0.72 }, 0.32);

      tl.to(["#reticle", "#search-label"], { opacity: 1, duration: 0.36 }, 1.18);
