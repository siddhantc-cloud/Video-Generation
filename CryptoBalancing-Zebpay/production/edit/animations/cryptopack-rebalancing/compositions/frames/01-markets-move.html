  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script>
    (() => {
      const frameRoot = document.querySelector('[data-composition-id="01-markets-move"]');
      const world = frameRoot.querySelector('[id="01-markets-move-world"]');
      const module = frameRoot.querySelector('[id="01-markets-move-module"]');
      const activeCoin = frameRoot.querySelector('[id="01-markets-move-active-coin"]');
      const sequenceFill = frameRoot.querySelector('[id="01-markets-move-sequence-fill"]');
      const driftNote = frameRoot.querySelector('[id="01-markets-move-drift-note"]');
      const noteConnector = frameRoot.querySelector('[id="01-markets-move-note-connector"]');
      const pulseMarker = frameRoot.querySelector('[id="01-markets-move-pulse-marker"]');
      const shimmerEls = Array.from(
        frameRoot.querySelectorAll('[class~="01-markets-move-bar-shimmer"]'),
      );

      const CONTENT = [
        {
          key: "COIN 01",
          body: "allocation",
          bar: frameRoot.querySelector('[id="01-markets-move-bar-1"]'),
        },
        {
          key: "COIN 02",
          body: "allocation",
          bar: frameRoot.querySelector('[id="01-markets-move-bar-2"]'),
        },
        {
          key: "COIN 03",
          body: "allocation",
          bar: frameRoot.querySelector('[id="01-markets-move-bar-3"]'),
        },
      ];

      const BASE_DURATION = 0.34;
      const SEC_PER_CHAR = 0.012;
      const HOLD_MID = 0.18;
      const HOLD_FINAL = 0.42;
      let cumulative = 0;
      const TIMELINE = CONTENT.map((entry, index) => {
        const hold = index === CONTENT.length - 1 ? HOLD_FINAL : HOLD_MID;
        const duration = BASE_DURATION + entry.body.length * SEC_PER_CHAR + hold;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });

      function entryAt(time) {
        for (let i = TIMELINE.length - 1; i >= 0; i -= 1) {
          if (time >= TIMELINE[i].start) return TIMELINE[i];
        }
        return TIMELINE[0];
      }

      const rootRect = frameRoot.getBoundingClientRect();
      const moduleRect = module.getBoundingClientRect();
      const targetOffsetX =
        moduleRect.left + moduleRect.width / 2 - (rootRect.left + rootRect.width / 2);
      const targetOffsetY =
        moduleRect.top + moduleRect.height / 2 - (rootRect.top + rootRect.height / 2);
      const OPEN_SCALE = 3.05;
      const cam = {
        scale: OPEN_SCALE,
        x: -targetOffsetX * OPEN_SCALE,
        y: -targetOffsetY * OPEN_SCALE,
      };

      function applyCamera() {
        world.style.transform = `translate(${cam.x}px, ${cam.y}px) scale(${cam.scale})`;
      }

      applyCamera();

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["01-markets-move"] = tl;

      tl.fromTo(module, { opacity: 0.01 }, { opacity: 1, duration: 0.34, ease: "power2.out" }, 0);

      TIMELINE.forEach((entry) => {
        const targetScale = Number(entry.bar.dataset.targetScale);
        const driftScale = Number(entry.bar.dataset.driftScale);
        tl.fromTo(
          entry.bar,
          { scaleX: targetScale },
          {
            scaleX: driftScale,
            duration: Math.min(0.74, entry.end - entry.start + 0.18),
            ease: "power2.inOut",
          },
          0.2 + entry.start,
        );
      });

      const sequenceDriver = { t: 0 };
      let lastKey = "";
      tl.to(
        sequenceDriver,
        {
          t: cumulative,
          duration: 2.1,
          ease: "none",
          onUpdate: () => {
            const entry = entryAt(sequenceDriver.t);
            if (entry.key !== lastKey) {
              activeCoin.textContent = entry.key;
              lastKey = entry.key;
            }
            sequenceFill.style.transform = `scaleX(${sequenceDriver.t / cumulative})`;
          },
        },
        0.16,
      );

      tl.fromTo(
        cam,
        {
          scale: OPEN_SCALE,
          x: -targetOffsetX * OPEN_SCALE,
          y: -targetOffsetY * OPEN_SCALE,
        },
        {
          scale: 1,
          x: 0,
          y: 0,
          duration: 1.9,
          ease: "power4.out",
          onUpdate: applyCamera,
        },
        2.4,
      );

      tl.fromTo(
        noteConnector,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.48, ease: "power3.out" },
        4.58,
      );
      tl.fromTo(
        driftNote,
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.72, ease: "power3.out" },
        4.72,
      );

      shimmerEls.forEach((shimmer, index) => {
        tl.fromTo(
          shimmer,
          { xPercent: -125 },
          {
            xPercent: 240,
            duration: 0.86,
            ease: "power2.inOut",
          },
          6.36 + index * 0.16,
        );
      });

      tl.fromTo(
        pulseMarker,
        { scaleY: 1, opacity: 0.62 },
        { scaleY: 1.62, opacity: 1, duration: 0.34, ease: "power2.out" },
        7.02,
      );
      tl.to(
        pulseMarker,
        { scaleY: 1.1, opacity: 0.72, duration: 0.46, ease: "power2.out" },
        7.36,
      );

      const holdState = { value: 0 };
      tl.to(holdState, { value: 1, duration: 0.849, ease: "none" }, 7.82);
    })();
  </script>
