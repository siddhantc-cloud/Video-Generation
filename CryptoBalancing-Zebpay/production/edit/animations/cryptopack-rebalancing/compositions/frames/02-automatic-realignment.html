      const states = [
        { t: 0, text: "" },
        { t: 1.92, text: "Trim overweight" },

        { t: 7.18, text: "Back on track" },

        return "";
      };

      const tl = gsap.timeline({ paused: true });
      const labelDriver = { t: 0 };

      tl.set(overTarget, { opacity: 0.28 }, 0);

      tl.set(underDeficit, { scaleX: 0 }, 0);

      tl.set(statusBurst, { opacity: 0, scale: 1 }, 0);
      tl.set(statusGlow, { opacity: 0 }, 0);
      tl.set(statusCheck, { opacity: 0, scale: 0.55 }, 0);
      tl.set(overCheck, { opacity: 0, scale: 0.55 }, 0);
      tl.set(underCheck, { opacity: 0, scale: 0.55 }, 0);

      tl.fromTo(
        phone,
        { x: -54, opacity: 0.45 },
        { x: 0, opacity: 1, duration: 0.72, ease: "power3.out" },
        0

      tl.fromTo(
        module,
        { x: 54, opacity: 0.18 },
        { x: 0, opacity: 1, duration: 0.82, ease: "power3.out" },
        0.28

      tl.fromTo(
        phoneImage,
        { y: 0, scale: 1 },
        { y: -28, scale: 1.025, duration: 8.45, ease: "none" },

      tl.fromTo(
        progressFill,
        { scaleX: 0.16 },
        { scaleX: 0.72, duration: 8.45, ease: "none" },
        0
      );

      tl.to(
        labelDriver,
        {
          t: 8.45,
          duration: 8.45,
          ease: "none",
          onUpdate: () => {
            statusCopy.textContent = textAt(labelDriver.t);
          },
        },
        0
      );

      tl.fromTo(
        status,
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.48, ease: "power3.out" },
        1.78
      );
      tl.to(
        overRow,
        {
          borderColor: "rgba(8,125,245,0.55)",
          backgroundColor: "rgba(8,125,245,0.08)",
          duration: 0.38,
          ease: "power2.out",
        },
        1.80

      tl.to(overTarget, { opacity: 1, duration: 0.34, ease: "power2.out" }, 2.02);
      tl.to(overExcess, { scaleX: 0, duration: 1.25, ease: "power2.inOut" }, 2.18);
      tl.fromTo(
        transfer,

      tl.to(transfer, { x: -46, y: 136, duration: 0.68, ease: "power3.out" }, 3.34);

      tl.to(
        status,
        {

          filter: "blur(10px)",

          duration: 0.20,

      tl.set(status, { scale: 0.75, filter: "blur(10px)", opacity: 0.15 }, 5.02);

      tl.to(underTarget, { opacity: 1, duration: 0.34, ease: "power2.out" }, 5.08);
      tl.to(transfer, { x: 0, y: 268, duration: 0.82, ease: "power3.inOut" }, 5.02);
      tl.to(underDeficit, { scaleX: 1, duration: 1.25, ease: "power2.inOut" }, 5.16);

      tl.to(
        status,
        {
          scale: 0.96,
          backgroundColor: "rgba(8,125,245,0.15)",
          borderColor: "rgba(8,125,245,0.42)",
          duration: 0.18,
          ease: "power1.in",
        },
        7.00
      );
      tl.to(
        status,
        {
          scale: 1,
          backgroundColor: "rgba(8,125,245,0.08)",
          borderColor: "rgba(8,125,245,0.2)",
          duration: 0.58,
          ease: "back.out(1.8)",
        },
        7.18

      tl.fromTo(
        statusBurst,
        { scale: 1, opacity: 0 },
        { scale: 5, opacity: 0.62, duration: 0.25, ease: "power2.out" },
