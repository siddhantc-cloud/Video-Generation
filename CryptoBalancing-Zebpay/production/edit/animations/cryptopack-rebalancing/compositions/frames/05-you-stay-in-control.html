      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        title,
        { y: -58, opacity: 0, scale: 0.97 },

      const glowPhase = { p: 0 };

        glowPhase,

          duration: 3.76,
          ease: "none",

            glowLeft.style.transform = `scale(${1 + leftWave * 0.008})`;
            glowRight.style.opacity = String(0.12 + rightWave * 0.012);
            glowRight.style.transform = `scale(${1 + rightWave * 0.008})`;

          duration: 3.4,
          ease: "none",
          onUpdate: () => {
            const wave = Math.sin(cardPhase.p);
            floatLeft.style.transform = `translateY(${wave * -2}px)`;
